services:
  db:
    build:
      context: .
      dockerfile: Dockerfile

    image: concesionario-postgres:17

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bdconcesionario}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: ${TZ:-America/El_Salvador}
      PGTZ: ${TZ:-America/El_Salvador}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: